<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ASX Trend Analyzer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('home.home') }}">ASX Trend Analyzer</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('home.home') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('analyse.run_analysis') }}">Analyse</a>
                <a class="nav-link" href="{{ url_for('history.list_history') }}">History</a>
                <a class="nav-link" href="{{ url_for('trend.view_trends') }}">Trends</a>
                <a class="nav-link" href="{{ url_for('ai.ai_query') }}">AI</a>
                <a class="nav-link" href="{{ url_for('settings.index') }}">Settings</a>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        <aside class="alert alert-warning" role="note">
            <strong>Financial disclaimer:</strong> {{ config['DISCLAIMER'] }}
        </aside>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
